<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Person","@id":"https://kunalsk.com/#kunal-kaushik","name":"Kunal Kaushik","givenName":"Kunal","familyName":"Kaushik","url":"https://kunalsk.com/","image":"https://kunalsk.com/portrait.jpg","description":"I'm Kunal, an electrical engineering student at the University of Illinois Urbana-Champaign. I build robots, embedded systems, and computer vision tools.","jobTitle":"Electrical engineering student","affiliation":{"@type":"CollegeOrUniversity","name":"University of Illinois Urbana-Champaign"},"email":"mailto:kunalkaushik537@gmail.com","sameAs":["https://github.com/kunalk537","https://www.linkedin.com/in/kunalkaushik537"],"knowsAbout":["Electrical engineering","Robotics","Embedded systems","PCB design","Motor control","Computer vision"]},{"@type":"WebSite","@id":"https://kunalsk.com/#website","url":"https://kunalsk.com/","name":"Kunal Kaushik","inLanguage":"en","publisher":{"@id":"https://kunalsk.com/#kunal-kaushik"}},{"@type":"ProfilePage","@id":"https://kunalsk.com/#profile","url":"https://kunalsk.com/","name":"Kunal Kaushik","description":"Kunal Kaushik is an electrical engineering student at UIUC building robotics, embedded systems, custom PCBs, and computer vision projects. Explore his work and contact him.","inLanguage":"en","isPartOf":{"@id":"https://kunalsk.com/#website"},"mainEntity":{"@id":"https://kunalsk.com/#kunal-kaushik"},"hasPart":[{"@type":"CreativeWork","@id":"https://kunalsk.com/#title-nova","name":"Self-balancing humanoid","description":"This project actually started out as a tutoring gig, when my old teacher asked me to help her student with reading and writing. I caught a glimpse of his dad's garage during a session, and found an exciting opportunity to work on humanoids. I worked on a custom gearbox for the wheeled base, designing 3D-printed components for the frame to merge with aluminum inserts. I also was solely responsible for electronics, soldering a perfboard with a Raspberry Pi, IMU, and CAN hat with connectors for multiple motor drivers + quadrature encoders (hint: the price of those is the inspiration for my newest project). Teaching a robot to stay on its feet.","url":"https://kunalsk.com/#title-nova","creator":{"@id":"https://kunalsk.com/#kunal-kaushik"},"keywords":["Motor Control","Sensor Fusion","Raspberry Pi","CAN","Python","Soldering","Crimping","3D Printing","CAD"],"image":["https://kunalsk.com/nova1.png","https://kunalsk.com/nova3.png"]},{"@type":"CreativeWork","@id":"https://kunalsk.com/#title-snosight","name":"Smart Ski Goggles","description":"My friend and I spotted a pair of AR ski goggles on Shark Tank, and were excited to order them until we saw the price tag of $350. We set about making our own version, which could either be in a custom 3D-printed format or retrofitted into any pair of goggles (which we almost immediately realized was a better idea). The difficulty came with the harsh environment the electronics would be subjected to and the small form factor. The AR effect was created with an OLED screen and a laminate on the goggles themselves, all powered by a custom PCB I slaved away for hours to create, and spent even more hours trying to fix. Trying to fit a little more into a pair of ski goggles.","url":"https://kunalsk.com/#title-snosight","creator":{"@id":"https://kunalsk.com/#kunal-kaushik"},"keywords":["Embedded","PCB Design","Smartphone Integration","I2C","C/C++","Soldering"],"image":["https://kunalsk.com/snosight2d.png","https://kunalsk.com/snosight3.png"]},{"@type":"CreativeWork","@id":"https://kunalsk.com/#title-riftrobotics","name":"FTC competition robot","description":"This is the project where I can confidently say that I know how every single bit of hardware works, down to each screw and trace. I can't count the number of times I had to disassemble the linear slides or differential virtual four bar in the quest for optimization. But of course, there were plenty of electrical complications as well, from the installation of a servo power module to prevent voltage droop and the resoldering of a battery connector to recover the $300 REV Control Hub. Despite the hardware challenge, it was the leadership trials that took the cake; leading 7 people with different strengths, backgrounds, and personalities all while trying to develop a culture on the fly was certainly a novel experience. A robot, a team, and a lot of moving parts.","url":"https://kunalsk.com/#title-riftrobotics","creator":{"@id":"https://kunalsk.com/#kunal-kaushik"},"keywords":["DFM","Team Leadership","3D Design","Wiring","Java","C/C++","Soldering"],"image":["https://kunalsk.com/rift1.png","https://kunalsk.com/rift2.png"]},{"@type":"CreativeWork","@id":"https://kunalsk.com/#title-sensorarray","name":"Peripheral Breakout Board","description":"This board brings an ESP32, a motor driver, servo connections, and motion sensing into one place. I designed the schematic and four-layer PCB around the practical question of how to power and connect all of those pieces. While the original project the board was intended for was scrapped (an educational toy car), the utility of this right here has been endless. I can't count how many times I've used it to quickly hook up a servo or a couple motors - for sure more than I expected. Giving motors and sensors a board of their own.","url":"https://kunalsk.com/#title-sensorarray","creator":{"@id":"https://kunalsk.com/#kunal-kaushik"},"keywords":["Embedded","PCB Design","Motor Control","I2C","C/C++","Soldering","4-layer"],"image":["https://kunalsk.com/rumble1.png","https://kunalsk.com/rumble2.png"]},{"@type":"CreativeWork","@id":"https://kunalsk.com/#title-semiconductor","name":"Wafer alignment detection","description":"I explored whether computer vision could spot misalignment in semiconductor wafer images. That meant collecting and labeling 560 microscope images, working around an uneven dataset, and training a YOLOv9 model. The model reached a reported F1 score of 0.95 on the project dataset, but only after over 30 different iterations with over 6000 total epochs of training. For a problem that is on such a microscopic scale, getting it this accurate required a whole lot of persistence. It was worth it though - just imagine how useful this could be. Looking for tiny mistakes through a microscope.","url":"https://kunalsk.com/#title-semiconductor","creator":{"@id":"https://kunalsk.com/#kunal-kaushik"},"keywords":["Computer Vision","Dataset Creation","Model Training","Performance Metric Analysis"],"image":["https://kunalsk.com/semiconductor3.jpg","https://kunalsk.com/semiconductor1.jpg","https://kunalsk.com/semiconductor2.png","https://kunalsk.com/semiconductor4.png"]}]}]}</script>
