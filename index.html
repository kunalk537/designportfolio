      Load fonts non-blocking: download in parallel with the page, then swap the
      `rel` to `stylesheet` once it arrives. `display=swap` (already in the URL)
      means text still paints with the system fallback in the meantime, so
      first paint isn't blocked. Visually identical to the previous setup.
    -->

      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
